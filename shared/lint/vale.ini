# The shared Vale configuration (docs/TESTKIT.md § Lint stage). `atc sync` delivers it to `.atc/lint/vale.ini`
# with the ATC style beside it; the lint stage's hook runs `vale --config=<this file>`, and StylesPath is read
# relative to this file, so the same file serves this repository and every project.
StylesPath = vale
MinAlertLevel = warning

[*.md]
BasedOnStyles = ATC
