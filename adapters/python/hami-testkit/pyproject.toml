[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hami-testkit"
version = "0.4.0"
description = "Shared Hami pytest classification and change-impact selection"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
