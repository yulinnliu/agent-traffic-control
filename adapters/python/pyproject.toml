[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-traffic-control"
version = "0.12.0"
description = "Python reference implementation of the Agent Traffic Control contract tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.2",
    "atc-testkit",
    "jsonschema==4.23.0",
]

[project.scripts]
atc = "atc_cli:main"
atc-maintain = "atc_cli.maintain:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.6.1",
    # The build backends of atc and atc-testkit, so tests/test_wheel_install.py builds both wheels without isolation
    # and without the network.
    "hatchling==1.27.0",
    "setuptools>=68",
]
# The lint stage's tools (docs/design/ATC-0058.md § 3), run through pre-commit's local hooks.
lint = [
    "ast-grep-cli==0.51.3",
    "import-linter==2.16",
    "pre-commit==4.7.0",
    "ruff==0.17.5",
]
# The docs site's generator (docs/design/ATC-0060.md § 2); the lint stage builds the site with it.
site = [
    "zensical>=0.1.1",
]

[tool.uv]
# The lint stage, the docs site build among it, runs in the same environment as the tests (.pre-commit-config.yaml).
default-groups = ["dev", "lint", "site"]

[tool.uv.sources]
atc-testkit = { path = "atc-testkit", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atc_cli"]

[tool.atc-testkit]
unmarked_baseline = "tests/unmarked_baseline.txt"
selector = ["scripts/select_tests.py", "--json", "--paths"]

# Test files that read a directory or file of this checkout the import graph cannot see: a glob, a copy, a digest,
# a guarded path, or a script that reads them (docs/TESTKIT.md § Declared dependents). Keys are relative to this
# directory, patterns to the workspace root; `tests/root_reads.py` fails a session whose test files read a guarded
# path undeclared.
[tool.atc-testkit.dependents]
"tests/test_testkit_tmp.py" = ["adapters/python/atc-testkit/src/atc_testkit"]
"tests/test_testkit_release.py" = ["adapters/python/atc-testkit/src/atc_testkit", "adapters/python/atc-testkit/README.md"]
"tests/test_testkit_evidence.py" = ["adapters/python/atc-testkit/README.md"]
"tests/test_select_tests.py" = [
    "adapters/python/scripts", "adapters/python/src/atc_cli", "adapters/python/atc-testkit/src/atc_testkit",
    "adapters/python/tests",
]
"tests/test_tooling.py" = ["shared/skills", ".dsh/skills"]
"tests/test_manifest_content.py" = ["atc-manifest.yaml"]
"tests/test_integration_verify.py" = ["AGENTS.md"]
# Builds with this checkout's site configuration and compares the Pages workflow's paths with the hook's.
"tests/test_docs_site.py" = ["site", ".github/workflows/pages.yml", ".pre-commit-config.yaml"]
# What `scripts/link-skills.sh` and `check-skills.sh` read of their own checkout.
"tests/test_shell_install.py" = [
    "shared/governance", "shared/skills", ".claude/skills", ".agents/skills", ".dsh/skills", "*.md", "shared/templates",
]
"tests/test_packaged_schemas.py" = ["shared/policies/schemas", "adapters/python/src/atc_cli/schemas"]
# Builds and installs the wheels in a subprocess: any packaged module or the policy it composes.
"tests/test_wheel_install.py" = [
    "adapters/python/src/atc_cli", "adapters/python/atc-testkit/src/atc_testkit", "policies/hard-deny.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# The lint stage's Python rules (docs/design/ATC-0058.md § 3.2). The selection is named, so a ruff upgrade
# changes no rule.
[tool.ruff]
extend = "../../shared/lint/ruff.toml"
line-length = 120

[tool.ruff.lint]
extend-select = ["TID251", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture imported from a helper module is redefined as the parameter of the test that uses it.
"tests/**" = ["F811"]
# It puts atc-testkit/src on sys.path before importing the package from it.
"tests/test_testkit_evidence.py" = ["E402"]
# Every import of children.py sits at module level, so importing it proves it needs only the standard library
# (docs/TESTKIT.md § Child processes).
"!atc-testkit/src/atc_testkit/children.py" = ["PLC0415"]
# atc_testkit deletes a tree only through scratch.remove_tree, which rescans for links first.
"!atc-testkit/src/**" = ["TID251"]
"atc-testkit/src/atc_testkit/scratch.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"shutil.rmtree".msg = "delete through atc_testkit.scratch.remove_tree, which rescans the tree for links first"

[tool.importlinter]
root_packages = ["atc_cli", "atc_testkit"]

[[tool.importlinter.contracts]]
name = "atc_testkit imports no product code (docs/TESTKIT.md § Child processes)"
type = "forbidden"
source_modules = ["atc_testkit"]
forbidden_modules = ["atc_cli"]
