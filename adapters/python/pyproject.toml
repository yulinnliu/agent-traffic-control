[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-traffic-control"
version = "0.5.0"
description = "Python reference implementation of the Agent Traffic Control contract tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.2",
    "atc-testkit",
    "jsonschema==4.23.0",
]

[project.scripts]
atc = "atc_cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.6.1",
]

[tool.uv.sources]
atc-testkit = { path = "atc-testkit", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atc_cli"]

[tool.atc-testkit]
unmarked_baseline = "tests/unmarked_baseline.txt"
selector = ["scripts/select_tests.py", "--json", "--paths"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
