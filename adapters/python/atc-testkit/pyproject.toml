[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-testkit"
dynamic = ["version"]
description = "Shared ATC test classification, selection, isolation, running and verification"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.dynamic]
version = { attr = "atc_testkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
