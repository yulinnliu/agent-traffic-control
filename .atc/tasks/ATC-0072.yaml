scope: 'docs/design/ATC-0071.md § 4.2.1 measured that `atc integrate` (git_preflight and git_integrate) makes 76.5% of the root suite''s remaining git time by resolving the same refs and reading the same blobs again within one invocation, about 10% of the suite. This task makes one invocation resolve each ref and read each blob once, through one mechanism, so the real `atc integrate` gets faster too. The deliberate re-reads that detect another process moving main (git_integrate.py around :1178 and :1205 at 944b63c) stay uncached and outside the expected gain. First step, design: list each repeated query and which ones may be reused, how a reuse is invalidated when the invocation itself writes a ref, and the expected gain, in docs/design/<ID>.md; implementation follows after the Owner rules on the design. The change measures the gain with the same timing evidence as ATC-0071. It does not release.'
