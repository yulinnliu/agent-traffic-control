decisions:
  - "Owner 2026-11-13: ATC is stable enough that projects sync to formal releases; release automation makes releasing cheap. Scope: release pipeline, tag-only sync by default, first release v0.5.0 through it. PyPI: name availability check for agent-traffic-control and atc-testkit only, reported; no publish, no publishing job."
  - "Governance authorized for this task (Owner 2026-11-13, 「開，授權 governance」): the governance version-resolution rule changes from the canonical main tip to the latest release tag of governance_source, with an Owner-named SHA as the exception; routed through GOVERNANCE_CHANGES.md. AGENTS.md's bootloader and `atc onboard --sync`'s default follow it. No other governance edit."
  - "CI: validate.yml also runs on a pushed release tag and keeps workflow_dispatch; a tag push is the Owner's act, so the rule 'full CI is Owner-dispatched only' holds. On a release tag a job builds the testkit wheel, the conformance fixtures archive and SHA-256 sums and attaches them to a draft GitHub Release; the Owner publishes the draft."
  - "Release notes are committed in the repo (governance DELIVERY.md) and form the Release body; no CHANGELOG. The release commit (atc 0.5.0, testkit next version per CLI.md) is the task's last step, made on top of main as it stands then; notes cover everything since v0.4.0."
  - "Agents create no tag, push or publish. ATC-0038 runs in parallel and edits GIT_WORKFLOW.md, GOVERNANCE_CHANGES.md and the enforcement code; avoid those files except the GOVERNANCE_CHANGES.md entry this task needs, and expect a rebase."
  - "Owner ruling 2026-11-13 on the design (docs/design/ATC-0039.md), 「全照推薦」: Q1-Q4 all (a). Q1 commit release notes for v0.3.0 and v0.4.0 so one mechanism drafts every Release; v0.1.0 and v0.2.0 get none. Q2 `--revision` takes only a full 40-character commit SHA. Q3 the installed atc renders the target release's files, with a test rendering the v0.4.0 tree. Q4 a project locked ahead of the latest release is skipped, nothing written, exit 0."
