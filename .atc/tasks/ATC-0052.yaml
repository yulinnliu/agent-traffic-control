task_id: ATC-0052
title: Close-out unlinks inner junctions; session titles; squash message rule
repository: yulinnliu/agent-traffic-control
base_sha: de9a0d675832fee7105a53a332de2cc1d5486148
scope: 'Six changes in the workspace root, ahead of the release on 2026-11-16: 1. `atc task close`: a registered scratch that holds links (junctions, symlinks) whose targets all lie inside that same scratch is deleted. Each inner link is removed as a link, never by following it, and then the tree is deleted. A scratch with any link whose target lies outside it keeps today''s refusal, which names the link. 2. The shared skill `atc-review`, in its Claude Code overlay: a session started for a role is titled `[<task ID>] <topic>` and named `<task id lowercased>-<topic>` ([a-z0-9-], at most 24 characters); the coordinator gets the ID from `atc task create` before it starts the session, and never uses a placeholder. 3. Governance `GIT_WORKFLOW.md` § Explicitly authorized squash: the squash commit message no longer has to carry the source tip SHA; route the change through `GOVERNANCE_CHANGES.md`. 4. `atc test`''s related run, `--all`, a `--sha` export and `--mutants` run with the same isolated
  uv cache and environment the integration verifier uses (`~/.atc/cache/uv`), taken from the verifier''s own settings; seen: ATC-0049''s wheel test passed for the writer and failed in the verifier. 5. `atc test --mutants` without `--` selects each mutant''s judging tests with `select_tests` from its `edits[].path`, plus the mutant''s own `tests`, instead of every related test; `--` still decides when given; help and docs/TESTKIT.md follow. 6. The `atc-review` Claude Code overlay: a task whose deliverable is a report (a measurement, an investigation) commits it as `docs/design/ATC-<ID>.md` or sets `keep: reports` in its record, else close-out deletes it from `~/.atc/reports`; seen: ATC-0051''s measurement report.'
