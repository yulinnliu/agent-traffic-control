task_id: ATC-0049
title: Ship atc as a single executable, separate from the workspace
repository: yulinnliu/agent-traffic-control
base_sha: c1de26ac4de6d7413f12f3aca33865e243b7f42c
scope: 'A host runs `atc` as one executable per OS with only git installed: no Python or uv, and no clone of the ATC repository. The tool implements governance and reads no governance document at run time. What it reads from the ATC repository today splits three ways: - Its own formats go into the executable: `shared/policies/schemas/`, the hard-deny and enforcement tables, and the project layout of `docs/LAYOUT.md`. - Content it only delivers is fetched from `governance_source` at the release tag: governance, skills, and `CLAUDE.md`, which sync exports today from the local repository through `exported_target`. - Workspace data belongs to the workspace: task records, `workspace.yaml`, and the integration ledger. One release tag still names the tool and its delivered content together. The release tree carries a manifest listing what sync delivers and where it goes, and sync reads that manifest instead of the source paths hard-coded in `sync_project.build_plan`. Sync never depends on a project''s
  language or code layout. The first step is the design, committed as `docs/design/<ID>.md`. Implementation follows as later steps of this task once the Owner approves the design. The design must settle: 1. **Workspace location.** Where task records, `workspace.yaml` and the integration ledger live without the ATC clone, and how today''s canonical-checkout workspace migrates. 2. **Project pins.** How a project still pins an exact git revision of the delivered content (`.atc/atc.lock`), and how sync fetches it. 3. **Executable contents.** What goes into the executable, what comes from the manifest, and the manifest''s format. 4. **Build.** How it is built per OS, compared on size, start time, antivirus false positives and maintenance cost: PyInstaller or similar vs a rewrite. Who builds and signs it, and how a tag maps to its artifacts. 5. **Install and upgrade.** How the host installs and upgrades: what replaces `atc install` and the release copy, and whether Windows replacing a running
  `atc.exe` (WinError 32 at the 0.6.0 install) goes away. 6. **The PreToolUse hook.** What runs the hook engine and where its table lives. 7. **The testkit.** Where atc-testkit goes (it runs pytest in the project''s own environment), and how a non-Python project uses ATC. A `node` toolchain is out of scope. 8. **Development.** What developing ATC itself looks like: `uv run` in a topic worktree, and how `atc-maintain` survives. 9. **Release builds.** A managed, clean tree at an exact SHA for release builds, with no task-record commit (asked for by Hami-Coordinator for exe builds, 11-15), if the same mechanism covers it. 10. **Migration and order.** The order of steps from 0.6.0, and which are breaking.'
