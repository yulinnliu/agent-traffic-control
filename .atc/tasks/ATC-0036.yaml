decisions:
  - "claude_settings() in adapters/python/scripts/generate_enforcement.py emits, for every commands.deny entry, a PowerShell(<argv_prefix> *) deny beside the Bash(<argv_prefix>:*) deny. Reason: on Windows with Git Bash, any Bash deny silently disables Claude Code's PowerShell tool unless a PowerShell(...) rule exists (code.claude.com/docs/en/tools-reference § PowerShell tool), and PowerShell is otherwise unbounded by the hard denies."
  - "Tests and docs describing the rendered Claude settings are updated; the conformance fixture or golden output follows if one exists. Check whether atc enforce --check or validate compares rendered output and keep it passing."
  - "No re-render of project settings in this task: each project's .claude/settings.json is re-rendered by atc enforce in that project after this integrates, under its own Owner-approved integration."
  - "No allow rules are rendered; enforce stays deny-only. No authorizations/**, no governance edit, no version bump unless CLI.md requires one, no push, tag or publish."
