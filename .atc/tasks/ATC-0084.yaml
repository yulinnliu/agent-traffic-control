decisions:
- 'Owner 2026-11-28: the fix is a project-declared dependent list read by related selection, not a writer-side run of the verifier''s selection.'
- 'Owner 2026-11-28: atc-coordinator `references/briefs.md` stands (the writer never runs the full suite; the reviewer''s candidate is the one full run); HQT''s hand-over lesson to run whole test directories retires once this lands.'
- 'The task starts with the writer''s design step (atc-review "Writer: the design step"), design doc `docs/design/ATC-0084.md`.'
- 'Owner 2026-11-28: design (docs/design/ATC-0084.md § 9) adopted as recommended: D1 A [tool.atc-testkit.dependents] read by the testkit; D2 A test path -> patterns; D3 A the verifier and pre-push gate selection read it too; D4 A a stale pattern is a refusal in every atc test form and the contract check; D5 A the root''s DIRECTORY_READERS move into the table; D6 A a testkit default import-edge --direct for projects without a selector is a separate ATC task, not this one.'
