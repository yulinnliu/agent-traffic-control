task_id: ATC-0084
title: Related tests include project-declared dependents beyond one import edge
repository: yulinnliu/agent-traffic-control
base_sha: 20acd5f36f108a9bdcb01bbfa717f69dc3a7fd2d
scope: '`atc test ID` selects related tests through the tree''s `[tool.atc-testkit]` `selector` with `--direct`: the changed test files and the test files one import from a changed module (`docs/TESTKIT.md` § Commands, `atc test ID` step 2; § Configuration `selector`). A test that observes a changed file without importing it (HQT-0077: `scripts/tests/test_mutation_targets.py` reads `scripts/verify_*_mutations.py` by glob; ledger-directory tests) is never selected, so the writer''s run passes and the reviewer''s candidate fails, costing a review round. Design and specify how a project declares such dependents so `--direct` selects them, keeping related runs small, then implement it in atc-testkit and its conformance or tests. The HQT selector''s own declarations are Hami-Coordinator''s follow-up, not this task.'
tests: standard
