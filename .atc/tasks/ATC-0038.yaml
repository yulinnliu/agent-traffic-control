decisions:
  - "Step 1 is the design step only (atc-review \"Writer: the design step\"): a design document committed in the repo at the place docs/LAYOUT.md gives, no code. Implementation follows as later steps of this task after the Owner rules on the design; those rulings are appended here."
  - "The design covers: one PreToolUse hook generated from shared hard-deny.yaml (atc enforce) for Claude Code and Codex; absorbing worktree_cd_guard.py and write_scope_guard.py; fail-closed on hook error; a drift check (the generated hook vs hard-deny.yaml, like atc enforce --check); rules a prefix deny cannot express: `atc integrate` except `--check`, push to main, and `atc verify` / `atc test run` with run_in_background; matching for both the Bash and the PowerShell tool. Defense in depth, not a security boundary."
  - "The design states the per-call cost (one hook process per tool call, compared with today's two guards), what each tool's hook protocol can and cannot see, and the options with a recommendation for each open question the Owner must rule on."
  - "No authorizations/**. Any governance change is a proposal in the design, not an edit. No version bump, no push, tag or publish."
  - "Owner ruling 2026-11-13 on the design (docs/design/ATC-0038.md § 6), 「全照推薦」: Q1-Q7 all (a). Q1 workspace-wide rules in a new policies/hard-deny.yaml in this repo; Q2 command rules everywhere, repo-relative globs only in that project's repo and worktrees; Q3 fixed standard-library engine reading a composed JSON table; Q4 engine error and missing/invalid table deny, unresolvable targets allowed except the push-to-main case § 3.4 names; Q5 agent_write_roots in workspace.yaml; Q6 Owner-run `atc enforce --install-hooks`, the hook denies agents the table, engine files and that option; Q7 agents never pass --owner-run/--owner-words outside --check, plain `atc integrate` is denied until the Owner removes that policy entry, the record-on-main grant stays the gate."
  - "Governance authorized for this task by the Q7 ruling: the GIT_WORKFLOW.md change § 5 proposes, routed through GOVERNANCE_CHANGES.md. No other governance edit."
