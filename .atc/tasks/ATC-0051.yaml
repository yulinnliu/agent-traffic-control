scope: 'Implement the measurement report''s P4 and P6 (~/.atc/reports/ATC-0051-measurement.md). P4: decouple the modules conftest.py or the pytest plugin load in every test (atc_cli, content and any other frequently changed module) so a change to them no longer forces the full suite, and make select_tests'' reach graph tell top-level imports from function-level (lazy) imports so a single script change selects only the tests that reach it; prove with mutants that selection does not miss a test that reaches the changed code, and recompute selection over the saved verify logs'' ranges to show the before/after share. P6: atc test, --mutants (per mutant) and --candidate print elapsed time per stage and keep it in a fixed place (task, sha, stage, seconds, workers); a change to the verification evidence format goes through shared/conformance, not governance.'
