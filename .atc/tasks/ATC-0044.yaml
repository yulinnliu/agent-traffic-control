decisions:
  - "Owner 11-14: open after ATC-0043 integrated; one task for the three scratch issues below."
  - "(a) Source: the ATC-0042 reviewer left ~/.atc/tmp/atc-0042-review (bt/, qdr/, tree/) unregistered, so close-out missed it and the Owner had to approve its deletion. `atc tmp checkout` already requires --task; `atc test run --scratch <name>` does not. Every command that creates or reuses a scratch under the tmp root (ATC_TMP or ~/.atc/tmp) must require --task and register it; no path creates an unowned scratch. Audit all such commands (test run, test mutants, test private, tmp checkout, verify candidates if applicable)."
  - "(b) close-out --check also lists, as needing Owner consent, scratches under the tmp root whose name starts with the task ID (case-insensitive) but are not registered to it. close-out never deletes them automatically."
  - "(c) Source: the ATC-0042 reviewer found `atc test mutants` run from a worktree .venv imported the worktree's atc_testkit instead of the scratch copy, so all 5 mutants survived and the import guard did not catch it; after `uv sync` inside the copy all were killed. Make mutants run in the scratch copy's own environment (or refuse with a clear error when the imported package is not from the scratch tree). Keep the import guard's intent and make it catch this case."
  - "No version bump; the next release batches it."
  - "Owner 11-14 (quote: 「1、2、3 併進 0044，GIT_WORKFLOW 授權」): scope adds (d), (e) and (f)."
  - "(d) Owner 11-14: adapters/python/atc-testkit/README.md:182 says 'onboarding'; reword to name the current flow (`atc sync`) only where it refers to the command, otherwise neutral wording."
  - "(e) Owner 11-14: close-out's verdict parsing (adapters/python/scripts/close_out.py verdict_of) misreads some CONDITIONAL PASS first lines (flagged by the ATC-0042 writer). Find the failing forms (e.g. negation before CONDITIONAL, lowercase, punctuation, 'PASS (conditional)'), fix, and pin them with tests."
  - "(f) Owner 11-14 authorizes a governance edit to shared/governance/GIT_WORKFLOW.md for this topic only: replace `atc onboard --sync --project <project>` / `atc onboard --sync --all` and `atc onboard --sync --root-only` with the ATC-0043 forms `atc sync <project>` / `atc sync` / `atc sync --root`. Semantics-preserving rename only; no other rule changes; follow GOVERNANCE_CHANGES.md."
