task_id: ATC-0048
title: Install atc from a release tag
repository: yulinnliu/agent-traffic-control
base_sha: cc9f1fe4aa6e04c5c82b789442f49fb21996db59
scope: The installed `atc` runs the code of a release tag, not of the canonical checkout's `main`, so integrating into `main` changes nothing a project runs until the Owner tags and installs a release. The installed copy is a detached Git worktree of the workspace root repository at the tag, with `atc` an editable install of its `adapters/python`; the PreToolUse hook that `atc guard --install` writes runs that copy's `pretooluse_hook.py`. When nothing else names the workspace root, `atc` finds it as the main worktree of the repository its own code lives in, so a release copy resolves to the canonical checkout. Add the Owner-run command that installs a given tag on this host (create the release copy, install it, report the old and new version) and its `--check`, with the tool, the hook guard and the hard-deny table treating it like `push`; `atc doctor` reports the installed version and the copy it runs from. Revisit the canonical-checkout guard (`CHECKOUT_NOT_MAIN`, `CHECKOUT_DIRTY`) for
  what it still protects once the tool no longer runs from that checkout, and record the ruling. Update `AGENTS.md`, `adapters/python/README.md`, `docs/WORKFLOW.md`, `docs/ATC_HOME.md`, `docs/ENFORCEMENT.md`, `docs/TESTKIT.md` and every other text that says the installed `atc` runs the checkout's code. Development keeps `uv run --locked atc-maintain` and `uv run atc` in a topic worktree.
tests: strict
