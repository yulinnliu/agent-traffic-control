decisions:
- 'Owner 11-14 「照第1種，發布前就要弄好了吧?」: the installed `atc` follows a release tag instead of `main`, done before the 0.6.0 release so 0.6.0 is the first release installed this way; ATC-0047 integrates after this task and its notes describe the install.'
- The release copy is a detached worktree of the workspace root repository (code, scripts, schemas and hook at one revision, no packaging change); a wheel or PyPI install is out of scope.
- 'Installing a release on a host is an Owner action like push: agents may run only its `--check`.'
- No change under `shared/governance/`; if one turns out to be needed, stop and report it to the coordinator.
- 'Release copy location (writer): ~/.atc/releases/<tag>, one locked detached worktree of the workspace root repository per tag. Per-user like the uv tool install it backs; outside the workspace write roots and worktrees/, so no task tooling or close-out touches it, and the hook table write-protects ~/.atc/releases; one copy per tag makes an install atomic for running sessions (the hook keeps the old copy until atc guard --install) and a rollback is atc install <earlier tag>.'
- 'Install command (writer): atc install TAG [--check] [--json] in the Workspace group, Owner-run, hard-deny rule atc-install unless --check/--help/-h. One verdict line: INSTALLED (new and old version and copy; names atc guard --install when a hook table exists), CHECK, CURRENT. STOP TAG_UNKNOWN, TAG_NOT_ON_MAIN, RELEASE_COPY_INVALID; ERROR TAG_INVALID, ROOT_NOT_MAIN_WORKTREE, UV_MISSING, INSTALL_FAILED, COPY_FAILED, each with hint:. The root may be any repository''s main worktree, so a fresh clone installs its first release with uv run atc install. On Windows the running atc.exe and atc-maintain.exe are renamed aside and copied back before uv tool install --force, since Windows refuses to overwrite a running executable; INSTALL_FAILED names the manual uv command.'
- 'Canonical-checkout guard ruling (writer): keep CHECKOUT_NOT_MAIN and CHECKOUT_UNREADABLE (refuse every command but doctor) and CHECKOUT_DIRTY (warn), retargeted from the checkout serving the code to the canonical checkout of the resolved root: atc and every session still read the workspace from its working tree (task records, the policies atc guard --install composes, governance, skills). atc-maintain also refuses in a release copy; doctor reports the installed version and copy, WARN while atc still runs the canonical checkout.'
- 'Owner 11-14 「好，併進 0048」 (relayed by ATC-Coordinator): add (1) a version-mismatch guard: atc refuses with STOP and a hint when it acts on a registered project whose .atc/atc.lock revision is not the installed release''s revision; doctor and sync stay usable (sync is the fix), the root project is exempt, doctor reports each project''s pin against the installed revision; (2) release-copy integrity: doctor reports a release copy that is not clean at its tag; whether the main command path also refuses is the writer''s ruling.'
- 'Release-pin ruling (writer): an atc running from a release copy stops task create/update/resume/close, test ID (not --clean, --list, --private), integrate and push, --check rehearsals included, with STOP RELEASE_MISMATCH and a hint (atc sync <project>, or atc install of the pinned tag) when the project''s .atc/atc.lock does not pin the release''s commit or is missing. Usable under a mismatch: doctor, guard, task list (read), sync and install (the fix), init/add/remove (the map), every --help. Exemptions: the workspace root project is never compared (it pins nothing; its main is the governance), and an atc not running from a release copy (uv run atc in a topic worktree, or still installed from the canonical checkout) compares nothing. The guard runs in the dispatcher (scripts/release_pin.py) before the command. doctor lists projects.<name>.pin against the installed release.'
- 'Release-copy integrity ruling (writer): doctor reports ERROR when the release copy has tracked modifications or its HEAD is not its tag''s commit; commands do not refuse for it, since the hook write-protects ~/.atc/releases, so only the Owner''s own hand changes a copy, and a per-command check would add Git calls to every command.'
- 'Coordinator fold-in (standing ruling, findings fold into the in-progress task): atc test ID --mutants with an unreadable, non-JSON or wrongly shaped file stops with STOP MUTANTS_INVALID and a hint showing the shape, checked in task_tests.run_mutants before any export or scratch; the testkit runner reads the file with the same check (exit 9). An empty list is invalid.'
- 'Coordinator ruling after the review at abcda2a: "when atc runs from a release copy, atc sync with no --revision targets the installed release''s commit, not the latest tag ... Keep the latest-tag default when no release is installed." An installed release not on main stops sync with RELEASE_NOT_ON_MAIN.'
- 'The RELEASE_MISMATCH hint follows the direction: a pin behind the installed release, or no lock, names atc sync <project>; a pin ahead of it, which sync never moves back without --revision, names the Owner''s atc install of the pinned tag. doctor reports the same detail and hint.'
- 'The release-pin guard reads a project only from the subcommand''s own parser: the ID positional, or for task create only --project or the cwd; an ID-shaped option value or title never selects the project.'
- atc test --candidate --sha takes the full SHA or a unique prefix of 12 or more characters (git_integrate SHA_FORM, governance GIT_WORKFLOW.md § Integrate); a 7-character SHA is refused with REVIEWED_SHA_INVALID by design and left as is.
