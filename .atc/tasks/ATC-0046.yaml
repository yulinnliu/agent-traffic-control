decisions:
- 'Owner 11-14: 「一次做六組」 — implement all six CLI review groups in this one task; Owner 11-14 「授權」 — this task may change shared/governance/GIT_WORKFLOW.md (§ Integrate, § Publication boundary), shared/governance/VERIFICATION.md (test levels) and the hard-deny rules (allow `atc integrate --help`; `atc push` and `atc remove` agent-runnable only with --check). Route the governance edits through GOVERNANCE_CHANGES.md. Never touch authorizations/**.'
- The decisions below are the settled text of handoff CURRENT.md item 16, copied verbatim; where an earlier sentence and a later group disagree, the later group wins (e.g. group 2 removes --owner-run/--owner-words; the output rule replaces any 'next step' line; `enforce` is renamed `guard` and `atc-dev` is `atc-maintain`; `atc task create TITLE [--scope] [--tests] [--file F]` takes the title positionally and `atc task decide` is replaced by `task update ID --decision`; `--version` is removed; `atc test candidate` is `atc test ID --candidate`).
- 'Naming rules (CURRENT.md item 16, all six groups settled; becomes ATC-0046). Rules: one verb per action across the CLI (create/list/--check/clean); output = verdict line (see Output rule below), relative paths, one --json shape; `Owner` means only the human; claude/codex/dsh are a **harness** everywhere (worktree --owner -> --harness, atc-worktree contract owner token, OWNER+TOPIC; skill_tools -> skill_harnesses before 0.6.0 ships so no alias is needed; hook --harness unchanged; --owner-run/--owner-words unchanged).'
- 'Group 1 settled: `atc task create "scope" [--file F] [--version V] [--project P]` creates worktree + branch + record + commit in one step; worktree/branch named by task ID (harness+ATC-0046), harness auto-detected; `atc task decide ID "text" [--file F]` appends one decision with safe YAML and commits; scope is required and never rewritten (extensions go to decisions); every later command takes the task ID; no aliases before 1.0 (Owner 11-14): task new, worktree --owner/--topic, --version, the onboard alias and skill_tools are removed in 0.6.0; no compatibility code at all (Owner 11-14, development stage): removed names get the plain argparse usage error, no hint lines; old harness+topic worktrees are cleaned with the current release before switching; fields: title (positional, required) + scope (description) + decisions; `task update ID [--title] [--scope] [--decision]... [--file F]`, --file is Markdown (# title, ## Scope, ## Decisions list), one commit per run, a scope change appends
  the old scope as a decision; no --issue yet (Jira later via a tracker adapter); atc-worktree machine contract bumps for task-ID identity and harness.'
- 'Output rule (Owner 11-14): success = one verdict line, no next line (a workflow table in docs/WORKFLOW.md and `atc --help` covers the happy path); STOP/ERROR = reason line + `hint:` line with the concrete fix; -v adds detail; --json one shape with a hint field.'
- 'Group 2 settled (--sha optional; `atc verify` renamed `atc test candidate ID [--sha]`, Owner 11-14): `atc integrate ID [--check] [--sha]`; reviewed SHA read from the latest PASS review, commits after it refused; rebase detected by patch-id (no --rebased); --owner-run/--owner-words, --verify-timeout, --task, --project, --reviewed removed; integrate without --check records the Owner; hard-deny must allow `atc integrate --help`; GIT_WORKFLOW § Integrate needs Owner authorization when implemented.'
- 'Test levels (Owner 11-14, revised): task records carry `tests: none|standard|strict` set by `task create/update --tests` or `## Tests` in --file; none = text-only changes, reviewer reads the diff, needs an Owner decision line; standard (default) = writer related tests, reviewer `atc test ID --sha` + `--candidate`; strict = changes to guards (refuse, delete, authority, safety boundary, data integrity) = standard + writer and reviewer `--mutants`; projects with testkit default standard, without testkit only none; reviewer may FAIL a task whose diff exceeds its level; CI after push still runs; testkit becomes an optional layer, core flow = task/review/integrate/close-out; VERIFICATION.md change needs Owner authorization.'
- 'Group 3 (adopted as proposed by the Owner''s 「一次做六組」 11-14): close-out -> `atc task close ID [--check]`, one run, consent items listed never deleted, --skip/--project removed (record keep stays); new `atc push NAME... | --all [--check]` run by the Owner (fetch, check every commit is from an approved integration or sync, push the checked SHA, confirm remote), bare `atc push` = check only, --all lists per repository and asks y/N, agents --check only via hard-deny, `preflight` group removed, GIT_WORKFLOW § Publication boundary needs authorization; integrate does not auto-close; tag/release = a later group.'
- 'Group 4 settled (Owner 11-14): `atc sync [NAME...] [--check] [--revision SHA] [-v] [--json]`, default one line per project (+new ~updated -deleted, current, commit sha), root adapters only when changed, skips/collisions/deletions always listed with a hint, -v lists files by relative path, --revision takes 7 chars, --root moves to atc-maintain, bare = all projects.'
- 'Group 5 settled (Owner 11-14): `atc tmp` folds into `atc test`; every form starts `atc test ID`: `atc test ID [--sha] [--all] [-v] [-- TESTS]`, `--mutants FILE [--sha] [-v] [-- TESTS]` (default tests = related; per-mutant kill_rule in FILE, default failure), `--candidate [--sha] [-v]` (was atc verify), `--clean`; `atc test --list [ID]`; mutants/candidate/clean mutually exclusive; --timeout to project config, --progress folds into -v, --tests into -- TESTS; status/private go to group 6; no --sha = run in the task worktree, --sha = auto export + register scratch `<ID>-<sha7>` (no tmp checkout, no ad-hoc names); --select/--wide/--touched replaced by default = directly related tests from task base_sha, --all = full suite, no SKIPPED_WIDE; --python, --label, mutants positional SHA/DIR removed; prune runs automatically.'
- 'Group 6 settled (Owner 11-14): deleted: task plan/start/rank/drop (backlog; IDs allocated from main, branches and integration records, no backlog branch), friction (only 4 incidents 09-19, all resolved 11-08; check_workspace and doctor hooks go with it; state/workspace-friction/ events.jsonl and its unrelated ntfc/ probe files asked item by item at implementation), classify, bootstrap status; merged: worktree create -> task create, worktree clean -> `task close ID [--abandon]`, worktree audit -> `task list -v`, worktree resume -> `task resume ID`, test status -> `doctor -v`, test private -> `atc test --private -- COMMAND` (user-facing), validate --projects -> `sync --check`; the worktree group is removed, atc-worktree contract bumps together with group 1; renamed: `bootstrap init` -> `atc init`, `bootstrap add` -> `atc add NAME [--url URL] [--skills ...]`, `enforce` -> `atc guard [--install]` (check, or install permission rules + PreToolUse hook; --out/--live-*/--local-out/--hook-out
  move to atc-maintain); new `atc remove NAME [--check]` (Owner-run, agents --check only via hard-deny): STOP while worktrees/NAME/ holds a worktree (hint: task close), else after y/N drops the workspace.yaml entry and its skill harness setting and removes an empty worktrees/NAME/; never deletes projects/NAME/, state/NAME/, the project''s ATC-managed files or .atc/tasks (paths printed; no --purge); maintainer-only commands move to `atc-maintain`, run only as `uv run --locked atc-maintain` in an ATC worktree, not in the installed atc or a published package: sync --root, validate, policies check, task check, guard --out; ATC AGENTS.md, CI and the integration verifier call it; kept: doctor. User CLI after all groups: `atc init | add | remove`, `atc task create|update|list|resume|close`, `atc test ID [--mutants F | --candidate | --clean]`, `atc test --list | --private`, `atc integrate ID [--check]`, `atc push NAME... | --all`, `atc sync [NAME...]`, `atc doctor`, `atc guard [--install]`.'
- 'Scope boundaries: one breaking change, no aliases, deprecation shims or hint code for removed names (argparse usage error only). Tests, conformance cases (shared/conformance/), skills (atc-worktree and any skill naming old commands; render with atc-maintain sync --root), README, docs/ (add docs/WORKFLOW.md workflow table), AGENTS.md, CI and the integration verifier argv are refactored to the new CLI in this task. Out of scope: the version bump, release notes, tag and project re-syncs (a separate release task after integration); deleting state/workspace-friction/ data (Owner decides item by item later). No change under ~/.claude/hooks; reinstalling hooks after integration is the Owner''s step.'
- 'Owner 11-14 「授權」 (relayed by the coordinator): the governance authorization of this task extends to the shared/governance/GIT_WORKFLOW.md sections that described removed flags (§ Task and authority, § Owner-run commands, § Integration verifier source, § Command results, § Cleanup trigger, § After formal review), to shared/governance/VERIFICATION.md § Independent review, and to shared/governance/DELIVERY.md:255; the edits route through GOVERNANCE_CHANGES.md.'
- 'N4 (Owner 11-14, verbatim 「同意，照你的建議做」 to the coordinator''s proposal): (1) create --base-sha takeover of a published topic is removed (push_topic is always false on this single host; a later task resume ID --from-origin if ever needed). (2) A squash is not closed with --abandon: atc task close reads the integration record, and a kind: squash line with the Owner''s words whose squash commit is on main, has the recorded target tip as its only parent and the recorded source tip''s tree, with the branch still at that source tip, closes the task as integrated with no flag, keeping the tip as archive/<ID>; anything else stays NOT_MERGED. GIT_WORKFLOW § Explicitly authorized squash, docs/TASKS.md, docs/WORKFLOW.md and atc-worktree follow.'
