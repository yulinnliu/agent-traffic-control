decisions:
- No skill. The mechanical part is a tool and the rest is a doc. `atc-maintain` is the ATC-development CLI; root `task`, `integrate` and `push` stay in `atc` (Owner 11-17).
- This task builds the tooling only. Cutting the next release with it (carrying ATC-0060 to ATC-0063 and this task) is a separate release task opened after this one integrates; the Owner names its versions then.
- Design first.
