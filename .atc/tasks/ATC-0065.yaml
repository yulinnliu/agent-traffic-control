scope: 'Tests only: no behaviour change, no version bump, no governance change. Each item adds the tests that kill a guard''s mutant, or, where a guard is equivalent or unreachable, says why in the step report. - **ATC-0055''s 13 reviewer mutants the review did not reach.** Their definitions are lost: the ATC-0055 verdict and its mutants file were removed at close-out. Re-derive each guard from its name and the ATC-0055 code on `main` (the sharded `--mutants` baseline: its worker grant and cap, `--dist loadgroup`, `Budget.shrink` after the baseline, the per-worker line records and their validity rule, and same-tree baseline reuse; docs/design/ATC-0055.md): t-files-superset, t-fields-not-compared, t-records-not-checked, t-stale-record-kept, t-recorded-always, t-reuse-ignored, t-records-not-cleared, t-baseline-serial, t-uncapped, t-dist-load, t-no-shrink, w-shrink-keeps-all, t-red-unnamed. The step report maps each name to `file:line`, what the guard blocks, and the test expected to kill its
  mutant. - **ATC-0057''s two survivors**, both in `claim()` of adapters/python/src/atc_cli/scripts/git_preflight.py: claim_first_wins (`sha not in owner`) and claim_in_range (`sha in position`). Both fail closed today; the killing tests use a ledger with a stray unrecorded commit and two lines claiming one commit. - **ATC-0058''s fail-safe fallbacks** in adapters/python/atc-testkit/src/atc_testkit/verifier.py, cited at 1aecea2 as lines 277, 311 and 378: `_Reuse.create` returning `None` when the candidate''s input set cannot be read; a stage whose files cannot be listed recording no input evidence; a non-Python toolchain running with no reuse. One dedicated test each, asserting that the stages still run and the note is printed.'
