task_id: ATC-0070
title: The lint stage runs --all-files when a range changes a lint input
repository: yulinnliu/agent-traffic-control
base_sha: 38432a7924a6731b30c77a9a159550e86bfbee99
scope: When a range changes a lint stage input, the lint stage runs `pre-commit run --all-files` instead of `--from-ref --to-ref`. The inputs are `.pre-commit-config.yaml` and `.atc/lint/**` in a project, `shared/lint/**` at the workspace root. Today the template excludes `.atc/`, so a changed rule file never re-lints the existing files until CI's all-files job. The same task settles a sync that changes `.atc/lint/**`, which bypasses the verifier (docs/design/ATC-0062.md § 3 and § 6 decision 1). It lands before any project adopts the lint stage. The change updates shared/conformance, the docs that describe the lint stage, and the tests. It does not release.
tests: strict
