task_id: ATC-0070
title: The lint stage checks the whole tree at every entry
repository: yulinnliu/agent-traffic-control
base_sha: 38432a7924a6731b30c77a9a159550e86bfbee99
scope: Every lint stage entry (the verifier, atc test ID, --lint, --candidate) lints the whole tree, so a changed lint rule, from a topic or from atc sync, re-checks every file at the next run; the commit hook and CI stay as they are (docs/design/ATC-0070.md). Updates shared/conformance, the docs describing the lint stage, and the tests. It does not release.
