- 'Owner 11-16 「atc guard --install 目前要另外裝有怪」, then 「為何不發版前做?發版是我們控制的，不急，沒有必要天天發，除非有重大BUG」: this lands before the next release; the release waits for it.'
- Design first. The design is reviewed before any implementation, because it changes the enforcement boundary.
