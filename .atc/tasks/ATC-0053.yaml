- 'Owner 11-16 「全部都做」 (retro proposal, relayed by the coordinator): add doctor''s version-skew check to this task. After ATC-0049 was integrated the host still ran atc 0.6.0 and `atc doctor` printed 5 ERRORs (per-project integration drift, guard table) with no line naming the root cause, an installed atc older than the workspace main.'
- 'Owner 11-16 「採用 ratchet」 (design item 1): automatic composition only tightens the table; loosening waits for the Owner''s atc guard --reset.'
- 'Owner 11-16 「全部採用」 on design items 2-6 after the design PASS at 3c273b0: (2) the new hard-deny rules and uv global-option normalisation; (3) a table that does not compose blocks every call; (4) the Owner adds governance_checkout: . to this host''s map by hand; (5) ATC_BEHIND_MAIN is a WARN root line and any NOTE exits 1; (6) doctor gains the NOTE status, marked BREAKING in the release notes.'
- '2026-11-16 Owner: four small items join ATC-0053. (a) The PreToolUse hook lets a PowerShell write to the env: drive, and to other PSDrives that hold no files, through; it is not a file-system write target. (b) atc-coordinator briefs.md names the review report with the full 40-character SHA, as atc-review does. (c) atc-review: a reviewer, a subagent included, writes its output files only inside a scratch registered to the task, never directly under ~/.atc/tmp. (d) atc-coordinator Claude Code constants: a turn a peer message started cannot start_session, an own_initiative card cannot carry cwd, and a writer in another project starts only after the Owner says a word in the coordinator''s session.'
- '2026-11-16 Owner (authorizes the shared/governance/ topic VERIFICATION.md § Test levels): strict mutants are written and run only by the reviewer. strict = standard plus the reviewer''s atc test <task> --mutants <file>; the writer writes and runs no mutant and lists, in the step report, the guards this change adds (file:line and what each blocks) as the reviewer''s starting point. Applies to ATC-0053 at once: the writer''s mutants file stays in the report as reference only.'
