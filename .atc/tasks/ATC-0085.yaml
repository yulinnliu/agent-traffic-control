scope: 'In a project without [tool.atc-testkit], atc task create already defaults to tests: none when no level is given (task_records.py create). When the level comes from the --file brief''s ## Tests and is not none, the TESTS_UNAVAILABLE refusal names the brief''s ## Tests line as the source and says to remove it or set it to none, instead of only ''pass --tests none''; a level from --tests keeps today''s hint. Behaviour is unchanged: an explicit level other than none still refuses. Update docs/TASKS.md where it states the refusal and the tests or conformance cases that cover it.'
