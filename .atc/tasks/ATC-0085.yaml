decisions:
- 'Owner 2026-11-28: from Rin-Coordinator''s retro; default the level to `none` instead of rewording the hint, which already says `pass --tests none`.'
- 'Scope before this update: In a project without `[tool.atc-testkit]`, `atc task create` without `--tests` picks a testkit level and then refuses with `TESTS_UNAVAILABLE` (`adapters/python/src/atc_cli/scripts/task_records.py` `check_tests_level`); rin-vn hit it 5 times. When `--tests` is not given and the project has no testkit, the level is `none` (which needs no Owner decision line there). An explicit other level still refuses as today. Update `docs/TASKS.md` and the CLI help where they state the default, and the tests or conformance cases that cover it.'
- 'Owner 2026-11-28: the default-to-none premise was already true in v0.11.0 (rin-vn''s refusals came from a brief''s ## Tests standard); option B: reword the refusal when the level comes from the brief, behaviour unchanged.'
