task_id: ATC-0055
title: The mutant baseline runs sharded and is reused on the same tree
repository: yulinnliu/agent-traffic-control
base_sha: 8db591ba9f90a12b3dc9c5e42a05458150b7d59a
scope: '`atc test ID --mutants FILE` first runs a baseline: the union of the judging tests, with the line recorder on (ATC-0054). Since ATC-0054 the mutants themselves are cheap, and the baseline is the cost. ATC-0054''s measurement had a 473 s baseline (510 tests) and 159 s for all 23 mutants. A reviewer who re-runs `--mutants` on the same tree, for example on a fix-only re-review or after adding a mutant, pays the full baseline again. - **Sharded baseline.** The baseline runs in shards across the host worker budget (docs/TESTKIT.md, the workers the host grants). Each shard records lines into its own place, and the records are merged before judging. The verdicts and the per-mutant test choice equal those of a single-process baseline. A baseline failure still stops the run and names the failing tests. - **Baseline reuse.** A `--mutants` run on the same tree SHA, with the same judging set and the same recorder version, reuses the previous baseline''s result and its line records instead of
  running the baseline again, and says so on its output. A different tree SHA, judging set, recorder or testkit version runs the baseline again. A failed or interrupted baseline is never reused. Records live in the task''s registered scratch, so close-out removes them. - **Unchanged.** The mutant runs stay serial on one worker token; `-- TEST...` and `NO_TESTS` behave as today. - **Measurement.** Run one `--mutants` file twice on the same tree: report the sharded baseline time against ATC-0054''s single-process figure (473 s on 9f06f65, or a fresh single-process run on the same machine state), and the second run''s baseline time (reused). - **Skill fold (Hami-Coordinator 11-16, from HQT-0035).** In atc-coordinator, step 6 and § Claude Code constants: close-out also stops (TaskStop) each reviewer subagent of the task after its last re-review. Until then it stays alive for fix re-reviews; otherwise it stays in the background list. - **Documentation.** docs/TESTKIT.md § `atc test ID --mutants`,
  the atc-review mutant guidance where it describes the baseline, and the CLI help.'
