scope: The `atc-coordinator` skill's close-out step tells the coordinator to stop each reviewer subagent of the task with TaskStop. A reviewer subagent that finished its last review has already left the background list, so the call only fails ("No task found", "is not running"). Reword `shared/skills/atc-coordinator/SKILL.md` step 6 (the "Stop each reviewer subagent" item) and `shared/skills/atc-coordinator/adapters/claude.md` (the close-out TaskStop line) so only a reviewer subagent the background list still shows as running or waiting is stopped, and a TaskStop that answers it already ended needs nothing more. Re-render the managed copies with `atc-maintain sync --root` and run `validate`.
