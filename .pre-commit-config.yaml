# The lint stage (docs/TESTKIT.md § Lint stage): the commit hook, `atc test ID --lint` and the integration verifier
# all run this one list. Local hooks run tools pinned by adapters/python/uv.lock (dependency group `lint`).
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2

  # Vale builds from source with Go; pre-commit downloads the pinned Go itself (docs/TESTKIT.md § Lint stage).
  - repo: https://github.com/vale-cli/vale
    rev: v3.27.0
    hooks:
      - id: vale
        language_version: 1.27.4
        args: [--config=shared/lint/vale.ini]
        types: [markdown]
        exclude: ^(\.claude|\.agents|\.dsh)/

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --quiet --locked --project adapters/python --group lint ruff check --no-cache --force-exclude
        language: system
        types: [python]
        files: ^adapters/python/
      - id: import-linter
        name: import-linter
        entry: uv run --quiet --locked --project adapters/python --group lint lint-imports --config adapters/python/pyproject.toml
        language: system
        pass_filenames: false
        files: ^adapters/python/(src|atc-testkit/src)/
      - id: ast-grep
        name: ast-grep
        entry: uv run --quiet --locked --project adapters/python --group lint ast-grep scan --config adapters/python/sgconfig.yml
        language: system
        types: [python]
        files: ^adapters/python/
      - id: ast-grep-rule-cases
        name: ast-grep rule cases
        entry: uv run --quiet --locked --project adapters/python --group lint ast-grep test --config adapters/python/sgconfig.yml --skip-snapshot-tests
        language: system
        pass_filenames: false
        files: ^adapters/python/(sgconfig\.yml|lint/ast-grep/)

      - id: whitespace
        name: no trailing whitespace, space before tab or conflict marker (git diff --check)
        entry: '[ \t]+$|^ +\t|^(<<<<<<<|>>>>>>>)( |$)'
        language: pygrep
        types: [text]

      # A shipped file works as a self-contained copy in any repository (adapters/python/README.md § validate).
      - id: no-checkout-environment-variable
        name: shipped files do not locate this checkout through ATC_ROOT
        entry: '\$\{?ATC_ROOT\b|\$env:ATC_ROOT\b'
        language: pygrep
        files: ^shared/(skills/|governance/|templates/ATC_README\.md$)
      - id: no-hami-path
        name: shipped files do not hard-code a ~/Hami path
        entry: '~[\/]hami([\/]|\b)'
        args: [--ignore-case]
        language: pygrep
        files: ^shared/(skills/|templates/ATC_README\.md$)
      - id: no-hard-coded-governance-source
        name: governance is named by governance_source, never by repository
        entry: '[A-Za-z0-9_.-]+/agent-traffic-control\b'
        language: pygrep
        files: ^(AGENTS\.md|shared/governance/CORE\.md|shared/templates/ATC_README\.md)$

      - id: workspace-contract
        name: this checkout's contract (atc-maintain validate)
        entry: uv run --quiet --locked --project adapters/python atc-maintain validate
        language: system
        pass_filenames: false
        always_run: true
      - id: policy-examples
        name: policy examples match their schemas (atc-maintain policies check)
        entry: uv run --quiet --locked --project adapters/python atc-maintain policies check shared/policies/examples
        language: system
        pass_filenames: false
        files: ^(shared/policies/|adapters/python/src/atc_cli/(schemas/|scripts/policies\.py$))
      - id: managed-skill-copies
        name: managed skill copies equal their render (atc-maintain sync --root --check)
        entry: uv run --quiet --locked --project adapters/python atc-maintain sync --root --check
        language: system
        pass_filenames: false
        files: ^(shared/skills/|\.claude/|\.agents/|\.dsh/)
      - id: packaged-schemas
        name: packaged policy schemas equal shared/policies/schemas
        entry: uv run --quiet --locked --project adapters/python python adapters/python/scripts/drift.py schemas
        language: system
        pass_filenames: false
        files: ^(shared/policies/schemas/|adapters/python/src/atc_cli/schemas/)
      # Every version pin agrees, min_atc is not above atc, and before the version is tagged its notes hold the
      # required sections and every task added since the last tag (docs/development/RELEASING.md § Check).
      # It always runs: the tasks come from the Git range, not from the files a commit changes.
      - id: release
        name: version pins and release notes (atc-maintain release check)
        entry: uv run --quiet --locked --project adapters/python atc-maintain release check
        language: system
        pass_filenames: false
        always_run: true
      # The docs site staged, built in strict mode and checked (docs/WORKFLOW.md § Docs site). The files are the
      # Pages workflow's paths; tests/test_docs_site.py keeps the two equal.
      - id: docs-site
        name: docs site builds and its pages pass the site check (docs_site.py check)
        entry: uv run --quiet --locked --project adapters/python python adapters/python/scripts/docs_site.py check
        language: system
        pass_filenames: false
        files: ^(README(\.[^/]+)?\.md|SCOPE\.md|GLOSSARY\.md|docs/.*|site/.*|adapters/python/(scripts/docs_site\.py|atc-testkit/src/atc_testkit/docs\.py|pyproject\.toml|uv\.lock)|\.github/workflows/pages\.yml)$
      - id: markdown-links
        name: Markdown relative links and anchors (atc_testkit.docs), every tracked file
        entry: uv run --quiet --locked --project adapters/python python -m atc_testkit.docs --anchors --tracked
        language: system
        pass_filenames: false
        always_run: true
