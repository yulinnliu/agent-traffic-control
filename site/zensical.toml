# The docs site (docs/design/ATC-0060.md, docs/development/DOCS_SITE.md). adapters/python/scripts/docs_site.py
# stages the repository's docs next to a copy of this file and builds them with Zensical; the content lives in the
# documents themselves, and the publication table in docs_site.py says which ones.
[project]
site_name = "Agent Traffic Control"
site_url = "https://yulinnliu.github.io/agent-traffic-control/"
site_description = "Governance for running several coding agents (Claude Code, Codex) on the same repositories."
repo_url = "https://github.com/yulinnliu/agent-traffic-control"
repo_name = "yulinnliu/agent-traffic-control"
edit_uri = ""
copyright = "MIT License"

[project.theme]
custom_dir = "overrides"
language = "en"
features = ["navigation.sections", "navigation.top", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

# Each home page's <title> by language: README.md under the theme's language, README.<lang>.md under <lang>;
# docs_site.py writes it into that page's front matter.
[project.extra.home_title]
en = "Agent Traffic Control: governance for Claude Code and Codex coding agents"
"zh-TW" = "Agent Traffic Control：Claude Code 與 Codex coding agent 的治理層"

# GitHub's heading anchors, so a link written for GitHub keeps its target on the site (design § 2.4).
[project.markdown_extensions.toc]
permalink = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.highlight"]
