name: validate contracts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and draft a Release for; empty validates the selected branch only
        required: false
        default: ''

# A tag push, or a dispatch naming a tag, validates that tag's tree and drafts
# its Release; a plain dispatch validates the selected branch.
permissions:
  contents: read

# Keep only the newest validation run for the same branch or pull request.
# A release run is keyed by its tag ref, the same for a tag push and a dispatch
# naming that tag, so the second waits and finds the first one's draft; a
# release run is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.tag }}

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: policy examples match their schemas
        run: |
          for name in hard-deny approval-required permission-presets escalation; do
            uvx --from check-jsonschema==0.33.0 check-jsonschema \
              --schemafile "shared/policies/schemas/$name.schema.json" \
              "shared/policies/examples/$name.yaml"
          done

  shell-install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: link-skills installs, check-skills verifies, drift and orphans are caught
        shell: bash
        run: |
          set -eu
          repo=$(mktemp -d)
          git -C "$repo" init -q -b main
          printf '# AGENTS.md\n\nIntro.\n\n## Integration verification\n\n- Verifier argv file: verify.json\n' > "$repo/AGENTS.md"
          echo '["true"]' > "$repo/verify.json"
          sh scripts/link-skills.sh "$repo" atc-worktree
          sh scripts/check-skills.sh "$repo"
          grep -qx "$(cat shared/templates/PROJECT_AGENTS.md)" "$repo/AGENTS.md"
          test -f "$repo/.atc/governance/INDEX.md"
          test -f "$repo/.atc/README.md"
          grep -q "^revision = \"$(git rev-parse HEAD)\"\$" "$repo/.atc/atc.lock"
          grep -q '^managed-by: agent-traffic-control$' "$repo/.claude/skills/atc-worktree/SKILL.md"
          if grep -q '\$ATC_ROOT\|\$env:ATC_ROOT' "$repo/.claude/skills/atc-worktree/SKILL.md" "$repo"/.atc/governance/*.md "$repo/.atc/README.md"; then echo "installed files point back at the checkout" >&2; exit 1; fi
          echo '# edited' >> "$repo/.claude/skills/atc-worktree/SKILL.md"
          echo '# edited' >> "$repo/.atc/governance/CORE.md"
          mkdir -p "$repo/.agents/skills/gone"
          printf -- '---\nname: gone\ndescription: x\nmanaged-by: agent-traffic-control\ncanonical: gone\n---\n' > "$repo/.agents/skills/gone/SKILL.md"
          if sh scripts/check-skills.sh "$repo"; then echo "check-skills missed drift" >&2; exit 1; fi
          sh scripts/link-skills.sh --prune "$repo" atc-worktree
          sh scripts/check-skills.sh "$repo"
      - name: a locked revision outside this checkout's history is stale, and link-skills re-locks it
        shell: bash
        run: |
          set -eu
          repo=$(mktemp -d)
          git -C "$repo" init -q -b main
          printf '# AGENTS.md\n\n## Integration verification\n\n- Verifier argv file: verify.json\n' > "$repo/AGENTS.md"
          echo '["true"]' > "$repo/verify.json"
          sh scripts/link-skills.sh "$repo" atc-worktree
          lock="$repo/.atc/atc.lock"
          sed 's/^revision = .*/revision = "0000000000000000000000000000000000000000"/' "$lock" > "$lock.tmp" && mv "$lock.tmp" "$lock"
          if out=$(sh scripts/check-skills.sh "$repo"); then echo "check-skills missed a stale lock" >&2; exit 1; fi
          echo "$out" | grep -q '^stale      .atc/atc.lock (revision 0\{40\} not in history)$'
          sh scripts/link-skills.sh "$repo" atc-worktree
          sh scripts/check-skills.sh "$repo"
          grep -q "^revision = \"$(git rev-parse HEAD)\"\$" "$lock"
      - name: link-skills stops before writing without the verification section or with an ignored output
        shell: bash
        run: |
          set -eu
          repo=$(mktemp -d)
          git -C "$repo" init -q -b main
          printf '# AGENTS.md\n\n## Build\n\nmake.\n' > "$repo/AGENTS.md"
          if out=$(sh scripts/link-skills.sh "$repo" atc-worktree); then echo "link-skills missed the missing section" >&2; exit 1; fi
          echo "$out" | grep -q '^stop       VERIFICATION_SECTION_MISSING '
          test ! -e "$repo/.atc"
          printf '\n## Integration verification\n\n- Verifier argv file: verify.json\n' >> "$repo/AGENTS.md"
          echo '["true"]' > "$repo/verify.json"
          echo '/.atc/' > "$repo/.git/info/exclude"
          if out=$(sh scripts/link-skills.sh "$repo" atc-worktree); then echo "link-skills missed an ignored output" >&2; exit 1; fi
          echo "$out" | grep -q '^stop       IGNORED_OUTPUT '
          test ! -e "$repo/.atc"

  python-adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: adapters/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The full history with its tags: a test renders the v0.4.0 release tree.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv run --locked python -m atc_testkit.ci --stages
      - run: uv run --locked python -m atc_testkit.ci --slow
      - run: uv run --locked python scripts/validate_workspace.py
      - run: uv run --locked python scripts/policies.py check ../../shared/policies/examples

  # The release is split so the write token never meets build code: release-build checks out, runs uv and builds
  # with a read-only token; release-draft runs no project code and hands the token only to its gh steps.
  release-build:
    if: github.ref_type == 'tag' || inputs.tag
    needs: [schemas, shell-install, python-adapter]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      atc: ${{ steps.guards.outputs.atc }}
      testkit: ${{ steps.guards.outputs.testkit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: the tag is a release tag of an integrated revision and names the atc version
        id: guards
        shell: bash
        run: |
          set -eu
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then echo "not a release tag: $TAG" >&2; exit 1; fi
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null || { echo "no tag $TAG" >&2; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main || { echo "$TAG is not on main; push main first" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" || { echo "checkout is not $TAG" >&2; exit 1; }
          atc=$(python3 -c 'import tomllib; print(tomllib.load(open("adapters/python/pyproject.toml", "rb"))["project"]["version"])')
          testkit=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' adapters/python/atc-testkit/src/atc_testkit/__init__.py)
          test "$TAG" = "v$atc" || { echo "$TAG does not name atc $atc" >&2; exit 1; }
          test -n "$testkit"
          printf 'atc=%s\ntestkit=%s\n' "$atc" "$testkit" >> "$GITHUB_OUTPUT"
          printf 'ATC_VERSION=%s\nTESTKIT_VERSION=%s\n' "$atc" "$testkit" >> "$GITHUB_ENV"
      - name: build the conformance archive, the atc-testkit wheel and its record, and their sums
        shell: bash
        run: |
          set -eu
          dist="$RUNNER_TEMP/release/dist"
          mkdir -p "$dist"
          conformance="atc-conformance-$ATC_VERSION.tar.gz"
          git archive --format=tar.gz --prefix="atc-conformance-$ATC_VERSION/" -o "$dist/$conformance" "refs/tags/$TAG" shared/conformance
          ( cd adapters/python && uv run --locked python scripts/build_testkit_release.py --output-dir "$dist" )
          wheel="atc_testkit-$TESTKIT_VERSION-py3-none-any.whl"
          test -f "$dist/$wheel" || { echo "the wheel is not $wheel" >&2; ls "$dist" >&2; exit 1; }
          ( cd "$dist" && sha256sum "$conformance" "$wheel" atc-testkit.json > SHA256SUMS && cat SHA256SUMS )
      - name: take the release notes committed on main
        shell: bash
        run: |
          set -eu
          notes="$RUNNER_TEMP/release/notes.md"
          git show "origin/main:docs/releases/$TAG.md" > "$notes" || { echo "no docs/releases/$TAG.md on main" >&2; exit 1; }
          test -s "$notes" || { echo "docs/releases/$TAG.md is empty" >&2; exit 1; }
          cat "$notes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  release-draft:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
      ATC_VERSION: ${{ needs.release-build.outputs.atc }}
      TESTKIT_VERSION: ${{ needs.release-build.outputs.testkit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: the downloaded assets match the sums release-build wrote
        shell: bash
        run: cd "$RUNNER_TEMP/release/dist" && sha256sum -c SHA256SUMS
      - name: no Release exists for the tag yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .html_url")
          if [ -n "$existing" ]; then echo "a Release already exists for $TAG: $existing" >&2; exit 1; fi
      - name: create the draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dist="$RUNNER_TEMP/release/dist"
          gh release create "$TAG" --draft --verify-tag --title "atc $ATC_VERSION (atc-testkit $TESTKIT_VERSION)" \
            --notes-file "$RUNNER_TEMP/release/notes.md" "$dist"/atc-conformance-*.tar.gz "$dist"/*.whl "$dist/atc-testkit.json" "$dist/SHA256SUMS"
