name: docs site

# Builds the docs site from main and publishes it to GitHub Pages (docs/WORKFLOW.md § Docs site). The paths are
# those of the docs-site hook in .pre-commit-config.yaml, plus this file; tests/test_docs_site.py keeps them equal.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.*.md
      - SCOPE.md
      - GLOSSARY.md
      - docs/**
      - site/**
      - adapters/python/scripts/docs_site.py
      - adapters/python/atc-testkit/src/atc_testkit/docs.py
      - adapters/python/pyproject.toml
      - adapters/python/uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a running deployment is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: stage, build and check the site
        env:
          # The Search Console token, a repository variable the Owner sets (docs/WORKFLOW.md § Docs site).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: uv run --locked --project adapters/python python adapters/python/scripts/docs_site.py build "$RUNNER_TEMP/docs-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
